name: Generate Blog Post

on:
  schedule:
    - cron: "0 2 * * 1"   # Every Monday 8:00 AM Bangladesh (UTC+6)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select weekly topic and generate post
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          WEEK=$(date -u +%V | sed 's/^0*//')
          INDEX=$(( (WEEK - 1) % 20 ))

          APP_SLUG=""
          case $INDEX in
            0)  TOPIC="Mental Math Master: from Kotlin to Flutter rebuild"
                APP="Mental Math Master"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.thenoob.mental_math_master"
                KEYWORD="mental math app android"
                SECONDARY="brain training app, flutter math game, mental arithmetic android" ;;
            1)  TOPIC="How SleepWise uses CBT-I to fix insomnia"
                APP="SleepWise AI Sleep Coach"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.sleepwiseai.app"
                KEYWORD="CBT-I sleep app android"
                SECONDARY="insomnia app, AI sleep coach, sleep quality tracker" ;;
            2)  TOPIC="Building an Islamic AI app: IlmAI story"
                APP="IlmAI Islamic AI and Quran"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ilmai.islamicqa"
                KEYWORD="Islamic AI app Quran"
                SECONDARY="Islamic Q&A app, Quran hadith app, Muslim AI assistant" ;;
            3)  TOPIC="Why we built a UK driving theory app from Bangladesh"
                APP="Driving Theory Test UK DVSA"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.drivingtheorytest.uk"
                KEYWORD="UK driving theory test app"
                SECONDARY="DVSA practice questions, hazard perception app, driving test prep" ;;
            4)  TOPIC="DreamNest AI: personalized bedtime stories for kids"
                APP="DreamNest AI"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.dreamnest.ai"
                KEYWORD="AI bedtime stories app"
                SECONDARY="personalized kids stories, bedtime app, AI children stories" ;;
            5)  TOPIC="Renu: why we never link to your bank"
                APP="Renu Subscription Tracker"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.renu"
                KEYWORD="subscription tracker no bank"
                SECONDARY="subscription manager app, recurring payments tracker, privacy finance app" ;;
            6)  TOPIC="BudgetWise vs Monarch: why we built a cheaper alternative"
                APP="BudgetWise Personal Finance"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.xihadulislam.myexpenses"
                KEYWORD="personal finance app no bank linking"
                SECONDARY="budget tracker app, offline finance app, debt payoff planner" ;;
            7)  TOPIC="Building Muslim Wise: Islamic finance tools for Gulf users"
                APP="Muslim Wise"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.muslimwise"
                KEYWORD="Islamic finance app halal stocks"
                SECONDARY="halal stock screener, zakat calculator, Islamic app Gulf" ;;
            8)  TOPIC="LifeWise: AI life coach at a fraction of the price of BetterUp"
                APP="LifeWise AI Life Coach"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.lifewise"
                KEYWORD="AI life coach app"
                SECONDARY="personal development app, daily action plan app, book summaries app" ;;
            9)  TOPIC="How we validate app ideas using market research and Google Trends"
                APP="OfBuilder studio"
                PLAY_LINK="https://ofbuilder.com"
                KEYWORD="how to validate app idea"
                SECONDARY="indie app development, app market research, flutter app ideas" ;;
            10) TOPIC="ShishuAI: AI baby care app for new parents"
                APP="ShishuAI Baby Care"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.shishuai.app"
                KEYWORD="AI baby care app"
                SECONDARY="baby tracker app, WHO growth chart app, vaccine tracker android" ;;
            11) TOPIC="Sakinah Fit: modest fitness app for Muslim women"
                APP="Sakinah Fit"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.sakinahfit"
                KEYWORD="Muslim women fitness app"
                SECONDARY="modest workout app, Ramadan fitness, halal nutrition app" ;;
            12) TOPIC="MindfulMuslim: Islamic meditation and dhikr app"
                APP="MindfulMuslim"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.mindfulmuslim"
                KEYWORD="Islamic meditation app"
                SECONDARY="dhikr app, muraqabah app, Muslim mindfulness" ;;
            13) TOPIC="One developer, 12 apps: the OfBuilder story"
                APP="OfBuilder studio"
                PLAY_LINK="https://ofbuilder.com"
                KEYWORD="indie app developer story"
                SECONDARY="indie hacker apps, flutter app portfolio, solo developer" ;;
            # Exam-intent topics: answer what people search, then point to the free web tests.
            14) TOPIC="What happens if you fail the Life in the UK test (and how to pass next time)"
                APP="Life in the UK Test 2026"
                APP_SLUG="life-in-the-uk"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.lifeuk"
                KEYWORD="failed life in the uk test"
                SECONDARY="life in the uk test retake, life in the uk pass mark, life in the uk mock test" ;;
            15) TOPIC="The most common UK driving theory test mistakes"
                APP="Driving Theory Test UK DVSA"
                APP_SLUG="driving-theory"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.drivingtheorytest.uk"
                KEYWORD="driving theory test tips"
                SECONDARY="theory test mock, hazard perception tips, DVSA theory test questions" ;;
            16) TOPIC="How long to study for CompTIA Security+"
                APP="Security+ SY0-701 Exam Prep"
                APP_SLUG="security-plus"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.securityplus"
                KEYWORD="how long to study for security+"
                SECONDARY="security+ study plan, SY0-701 practice test, security+ pass" ;;
            17) TOPIC="Canadian citizenship test: the topics people find hardest"
                APP="Canadian Citizenship Test 2026"
                APP_SLUG="canadian-citizenship"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.cacitizenship"
                KEYWORD="canadian citizenship test practice"
                SECONDARY="discover canada study guide, citizenship test questions, canada citizenship mock test" ;;
            18) TOPIC="Australian citizenship test: why the values questions matter"
                APP="Australian Citizenship Test"
                APP_SLUG="australian-citizenship"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.auscitizenship"
                KEYWORD="australian citizenship test practice"
                SECONDARY="our common bond, australian values questions, citizenship test mock" ;;
            19) TOPIC="A+ Core 1 vs Core 2: what's the difference and which to take first"
                APP="A+ Core 1 220-1201 Exam Prep"
                APP_SLUG="a-plus-core-1"
                PLAY_LINK="https://play.google.com/store/apps/details?id=com.ofbuilder.apluscore1"
                KEYWORD="comptia a+ core 1 vs core 2"
                SECONDARY="220-1201 practice test, 220-1202, comptia a+ study plan" ;;
          esac

          export TOPIC APP APP_SLUG PLAY_LINK KEYWORD SECONDARY
          export POST_DATE=$(date -u +%Y-%m-%d)
          export POST_DATETIME=$(date -u +%Y-%m-%dT%H:%M:%S+06:00)

          python3 scripts/generate_blog_post.py

      - name: Commit and push
        run: |
          git config user.name "ofbuilder-bot"
          git config user.email "hello@ofbuilder.com"
          git add content/blog/
          git diff --staged --quiet || git commit -m "blog: scheduled post $(date -u +%Y-%m-%d) $(date -u +%H:%M) UTC"
          git pull origin main --rebase
          git push
